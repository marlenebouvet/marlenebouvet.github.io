<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Une femme qui passe d'une pièce à l'autre : d'un côté un ordinateur, de l'autre un enfant">
  <rect x="4" y="4" width="112" height="112" rx="18" fill="#2b7a93"/>
  <rect x="11" y="11" width="98" height="98" rx="12" fill="none" stroke="#fff" stroke-width="2.5"/>
  <!-- flèche de passage -->
  <path d="M30 27q30-13 60 0" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.5 5.5"/>
  <path d="M86 20.5l8 6.5-10 2.5z" fill="#fff"/>
  <!-- pièces : plafond, sol, murs, linteau de la porte -->
  <path d="M18 34h84M18 98h84M18 34v64M102 34v64M60 34v14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <!-- pièce de gauche : bureau et ordinateur -->
  <path d="M22 80h22M24.5 80v18M41.5 80v18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <path d="M26 78V65a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v13z" fill="#fff"/>
  <path d="M29 68h10M29 72h10M29 76h6" stroke="#2b7a93" stroke-width="1.6" stroke-linecap="round"/>
  <!-- pièce de droite : enfant -->
  <circle cx="88" cy="80" r="5.5" fill="#fff"/>
  <path d="M80.5 98v-7a7.5 7.5 0 0 1 15 0v7z" fill="#fff"/>
  <!-- la femme dans l'encadrement de la porte -->
  <circle cx="60" cy="58" r="6.5" fill="#fff"/>
  <circle cx="55.5" cy="53" r="3.6" fill="#fff"/>
  <path d="M60 65.5c-5 0-8 4.5-9 10.5l-2.5 16h23l-2.5-16c-1-6-4-10.5-9-10.5z" fill="#fff"/>
  <path d="M55.5 92v6M64.5 92v6" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M65 72l7 5" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
</svg>
