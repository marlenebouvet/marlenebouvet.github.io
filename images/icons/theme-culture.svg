<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Représentation stylisée du diagramme de La Distinction de Pierre Bourdieu : espace des positions sociales">
  <rect x="4" y="4" width="112" height="112" rx="18" fill="#2b7a93"/>
  <rect x="11" y="11" width="98" height="98" rx="12" fill="none" stroke="#fff" stroke-width="2.5"/>
  <!-- espace social : contour en losange -->
  <path d="M60 24L94 52 82 92H38L26 52z" fill="none" stroke="#fff" stroke-width="1.8" stroke-dasharray="3.5 3.5" stroke-linejoin="round" opacity="0.7"/>
  <!-- axes : volume du capital (vertical) et composition du capital (horizontal) -->
  <path d="M60 28v64M28 60h64" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M60 19l5 8h-10zM60 101l5-8h-10zM19 60l8-5v10zM101 60l-8-5v10z" fill="#fff"/>
  <!-- nuage de positions -->
  <g fill="#fff">
    <circle cx="43" cy="36" r="4.5"/>
    <circle cx="53" cy="43" r="3.0"/>
    <circle cx="73" cy="37" r="4.0"/>
    <circle cx="82" cy="48" r="3.0"/>
    <circle cx="67" cy="50" r="2.8"/>
    <circle cx="36" cy="51" r="3.2"/>
    <circle cx="47" cy="68" r="4.0"/>
    <circle cx="39" cy="79" r="3.0"/>
    <circle cx="71" cy="70" r="4.5"/>
    <circle cx="81" cy="80" r="3.0"/>
    <circle cx="58" cy="82" r="3.2"/>
  </g>
</svg>
