<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Une femme en pantalon à la porte entre deux pièces : d'un côté un ordinateur portable, de l'autre un enfant">
  <rect x="4" y="4" width="112" height="112" rx="18" fill="#2b7a93"/>
  <rect x="11" y="11" width="98" height="98" rx="12" fill="none" stroke="#fff" stroke-width="2.5"/>
  <g transform="translate(0 -3)">
    <!-- pièces : plafond, sol, murs, linteau de la porte -->
    <path d="M18 28h84M18 100h84M18 28v72M102 28v72M60 28v18" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <!-- bureau -->
    <path d="M20 82h28" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M23.500 82v18M44.500 82v18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <!-- ordinateur portable : écran avec contenu, clavier -->
    <rect x="24" y="59" width="22" height="16" rx="2" fill="#0f4456" stroke="#fff" stroke-width="2.200"/>
    <path d="M27.500 64h8M27.500 68h12.500M27.500 72h6" stroke="#8ee0a8" stroke-width="1.600" stroke-linecap="round"/>
    <path d="M20.500 80h29l-2.300-4.500H22.800z" fill="#fff"/>
    <path d="M24 78.200h22" stroke="#2b7a93" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    <!-- enfant -->
    <circle cx="88" cy="82" r="5.500" fill="#fff"/>
    <path d="M80.500 100v-7a7.500 7.500 0 0 1 15 0v7z" fill="#fff"/>
    <!-- la femme (en pantalon) dans l'encadrement de la porte -->
    <circle cx="60" cy="60" r="6.500" fill="#fff"/>
    <circle cx="55.500" cy="55" r="3.600" fill="#fff"/>
    <path d="M51.500 72c3-3 14-3 17 0l-1 17H52.500z" fill="#fff"/>
    <path d="M55 87v13M65 87v13" stroke="#fff" stroke-width="6.500" stroke-linecap="round"/>
    <path d="M68 74l6 5" stroke="#fff" stroke-width="3.200" stroke-linecap="round"/>
  </g>
</svg>
