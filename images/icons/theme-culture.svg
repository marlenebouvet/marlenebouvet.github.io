<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Une femme qui passe d'une pièce à l'autre, entre ordinateur et enfant">
  <rect x="4" y="4" width="112" height="112" rx="18" fill="#2b7a93"/>
  <rect x="11" y="11" width="98" height="98" rx="12" fill="none" stroke="#fff" stroke-width="2.5"/>
  <!-- pièces -->
  <path d="M18 34h84v64H18z M60 34v26" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <!-- flèche -->
  <path d="M30 26q30-14 58 0" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 5"/>
  <path d="M84 20l7 6-9 3z" fill="#fff"/>
  <!-- ordinateur -->
  <rect x="25" y="62" width="20" height="13" rx="2" fill="none" stroke="#fff" stroke-width="2.5"/>
  <path d="M21 80h28M23 98V80M47 98V80" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- enfant -->
  <circle cx="86" cy="76" r="5.5" fill="#fff"/>
  <path d="M79 96v-6a7 7 0 0 1 14 0v6z" fill="#fff"/>
  <!-- femme au passage -->
  <circle cx="60" cy="52" r="7" fill="#fff"/>
  <path d="M66 49c4 2 5 8 3 12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 60l-12 38h24z" fill="#fff"/>
</svg>
