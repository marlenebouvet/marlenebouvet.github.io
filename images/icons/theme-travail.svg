<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Quatre professionnels : un ingénieur, une psychiatre, une curatrice et une infirmière">
  <rect x="4" y="4" width="112" height="112" rx="18" fill="#a11828"/>
  <rect x="11" y="11" width="98" height="98" rx="12" fill="none" stroke="#fff" stroke-width="2.5"/>

  <!-- ingénieur : casque jaune, gilet orange à bandes réfléchissantes -->
  <g transform="translate(35 36) scale(1.2)">
    <path d="M-14 18v-5c0-6 5-10 10-11h8c5 1 10 5 10 11v5z" fill="#f08a24"/>
    <path d="M-14 13h28v2.600h-28z" fill="#fff"/>
    <path d="M-4 2l4 6 4-6" fill="none" stroke="#fff" stroke-width="1.800" stroke-linejoin="round"/>
    <circle cx="0" cy="-6" r="6.800" fill="#ffe0cf"/>
    <path d="M-8.500 -7a8.500 8.500 0 0 1 17 0z" fill="#f2c14e"/>
    <rect x="-10.500" y="-8" width="21" height="2.800" rx="1.400" fill="#f2c14e"/>
    <circle cx="-2.500" cy="-4" r="0.900" fill="#5a1a22"/><circle cx="2.500" cy="-4" r="0.900" fill="#5a1a22"/>
  </g>

  <!-- psychiatre : blouse blanche, cheveux longs, lunettes -->
  <g transform="translate(85 36) scale(1.2)">
