<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Un professionnel au casque de chantier, en blouse avec stéthoscope, tenant un marteau">
  <rect x="4" y="4" width="112" height="112" rx="18" fill="#a11828"/>
  <rect x="11" y="11" width="98" height="98" rx="12" fill="none" stroke="#fff" stroke-width="2.5"/>
  <g transform="translate(-7 3)">
  <!-- blouse : épaules et corps -->
  <path d="M30 100V80c0-12 8-17 18-19l12 12 12-12c10 2 18 7 18 19v20z" fill="#fff"/>
  <!-- col de blouse -->
  <path d="M48 61l12 20 12-20" fill="none" stroke="#a11828" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- stéthoscope -->
  <path d="M52 66c-3 14 0 22 8 22s11-8 8-22" fill="none" stroke="#a11828" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="60" cy="89.5" r="3.3" fill="#a11828"/>
  <!-- poche -->
  <rect x="73" y="84" width="9" height="11" rx="1.5" fill="none" stroke="#a11828" stroke-width="2"/>
  <!-- tête et casque -->
  <circle cx="60" cy="42" r="11" fill="#fff"/>
  <path d="M45 41a15 15 0 0 1 30 0z" fill="#f2c14e"/>
  <rect x="42" y="39.5" width="36" height="5" rx="2.5" fill="#f2c14e"/>
  <path d="M60 26v14" stroke="#a11828" stroke-width="1.8" opacity="0.55"/>
  <!-- bras et marteau -->
  <path d="M82 70l10 9" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
  <g transform="rotate(20 94 80)">
    <rect x="91" y="54" width="6" height="42" rx="3" fill="#fff"/>
    <rect x="82" y="46" width="24" height="11" rx="3" fill="#fff"/>
    <path d="M88 46v11" stroke="#a11828" stroke-width="1.5"/>
  </g>
  </g>
</svg>
