    <path d="M-7.800 -8.500c0-5 3.500-7.500 7.800-7.500s7.800 2.500 7.800 7.500c-2.400-1.600-4.800-2.200-7.800-2.200s-5.400 0.600-7.800 2.200z" fill="#fff" stroke="#a11828" stroke-width="1"/>
    <path d="M-1 -15.500h2v1.800h1.800v2h-1.800v1.800h-2v-1.800h-1.800v-2h1.800z" fill="#a11828"/>
    <circle cx="-2.500" cy="-4" r="0.900" fill="#5a1a22"/><circle cx="2.500" cy="-4" r="0.900" fill="#5a1a22"/>
