    <clipPath id="plaid"><path d="M-14 18v-5c0-6 5-10 10-11h8c5 1 10 5 10 11v5z"/></clipPath>
  </defs>
  <g transform="translate(35 36) scale(1.2)">
    <path d="M-14 18v-5c0-6 5-10 10-11h8c5 1 10 5 10 11v5z" fill="#fff"/>
    <g clip-path="url(#plaid)">
      <path d="M-14 6h28M-14 12h28" stroke="#a11828" stroke-width="2.6"/>
      <path d="M-9 0v20M-3 0v20M3 0v20M9 0v20" stroke="#a11828" stroke-width="2.6"/>
      <path d="M-14 9h28M-14 15h28M-6 0v20M0 0v20M6 0v20" stroke="#111111" stroke-width="0.9"/>
    </g>
    <path d="M-3.500 2l3.500 5 3.500-5" fill="#fff" stroke="#a11828" stroke-width="1.100" stroke-linejoin="round"/>
    <path d="M0 7v11" stroke="#a11828" stroke-width="1"/>
    <circle cx="0" cy="-6" r="6.800" fill="#ffffff"/>
    <path d="M-7.600 -6c-1.200-6 2.500-9.600 7.600-9.600S8.800 -12 7.600 -6c-1.500-1.800-2.800-2.600-4.200-4.500-2.200 1.500-5.400 2-8.600 1.600-0.900 1.100-1.800 2.200-2.400 2.900z" fill="#a11828"/>
  </g>

