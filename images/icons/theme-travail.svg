    <path d="M-8 -5.500c-1-6 2-9 8-9s9 3 8 9v5h-2.800v-6c-3-1-7.200-1-10.400 0v6H-8z" fill="#4a2a24"/>
    <circle cx="-2.500" cy="-4" r="0.900" fill="#5a1a22"/><circle cx="2.500" cy="-4" r="0.900" fill="#5a1a22"/>
    <rect x="3" y="7" width="11" height="10" rx="1.200" fill="#f2c14e"/>
    <path d="M3 8.500h5v-2h2.500v2" fill="none" stroke="#f2c14e" stroke-width="1.200"/>
    <path d="M5.500 11.500h6M5.500 14h4" stroke="#a11828" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- infirmière : coiffe à croix rouge, tenue blanche -->
