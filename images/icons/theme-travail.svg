    <path d="M-3 2l3 5 3-5" fill="none" stroke="#a11828" stroke-width="1.500" stroke-linejoin="round"/>
    <circle cx="0" cy="-6" r="6.800" fill="#ffe0cf"/>
    <path d="M-7 -7.500c1.500-4 4-5.500 7-5.500s5.500 1.500 7 5.500c-2.200-1.600-4.500-2.200-7-2.200s-4.800 0.600-7 2.200z" fill="#5a3a2e"/>
    <g fill="none" stroke="#a11828" stroke-width="1.300"><circle cx="-2.800" cy="-5" r="2.300"/><circle cx="2.800" cy="-5" r="2.300"/><path d="M-0.500 -5h1"/></g>
  </g>

  <!-- curatrice : carré brun, blazer, dossier -->
  <g transform="translate(35 81) scale(1.2)">
    <path d="M-14 18v-5c0-6 5-10 10-11h8c5 1 10 5 10 11v5z" fill="#d9dbe3"/>
    <path d="M-4 2l4 8 4-8" fill="none" stroke="#8a8fa3" stroke-width="1.600" stroke-linejoin="round"/>
