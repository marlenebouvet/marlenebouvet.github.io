    <path d="M-14 18v-5c0-6 5-10 10-11h8c5 1 10 5 10 11v5z" fill="#fff"/>
    <path d="M-3 2l3 5 3-5" fill="none" stroke="#a11828" stroke-width="1.500" stroke-linejoin="round"/>
