<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Fenêtre à barreaux éclairée par un projecteur : la déviance et le contrôle social">
  <rect x="4" y="4" width="112" height="112" rx="18" fill="#494e52"/>
  <rect x="11" y="11" width="98" height="98" rx="12" fill="none" stroke="#fff" stroke-width="2.5"/>
  <!-- faisceau de projecteur, découpé dans le cadre -->
  <defs><clipPath id="cadre"><rect x="13" y="13" width="94" height="94" rx="10"/></clipPath></defs>
  <path d="M13 13L107 52L52 107z" fill="#fff" opacity="0.13" clip-path="url(#cadre)"/>
  <!-- fenêtre en arche à gros barreaux -->
  <path d="M34 98V56a26 26 0 0 1 52 0v42z" fill="#fff"/>
  <g fill="#494e52">
    <rect x="43" y="34" width="5.500" height="64"/>
    <rect x="53.500" y="30" width="5.500" height="68"/>
    <rect x="64" y="30" width="5.500" height="68"/>
    <rect x="74.500" y="34" width="5.500" height="64"/>
  </g>
  <!-- barbelés stylisés -->
  <path d="M14 98h92" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
</svg>
