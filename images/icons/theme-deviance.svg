<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Un oeil qui observe derrière des barreaux : la déviance et le contrôle social">
  <rect x="4" y="4" width="112" height="112" rx="18" fill="#494e52"/>
  <rect x="11" y="11" width="98" height="98" rx="12" fill="none" stroke="#fff" stroke-width="2.5"/>
  <defs><clipPath id="arche"><path d="M30 98V54a30 30 0 0 1 60 0V98z"/></clipPath></defs>
  <!-- fenêtre en arche sombre -->
  <path d="M30 98V54a30 30 0 0 1 60 0V98z" fill="#25292c"/>
  <!-- l'oeil, derrière les barreaux -->
  <path d="M33 62c8-12 17-17 27-17s19 5 27 17c-8 12-17 17-27 17S41 74 33 62z" fill="#fff"/>
  <circle cx="60" cy="62" r="11.500" fill="#494e52"/>
  <circle cx="60" cy="62" r="5.500" fill="#111"/>
  <circle cx="64" cy="58" r="2.600" fill="#fff"/>
  <!-- barreaux au premier plan -->
  <g clip-path="url(#arche)" fill="#fff">
    <rect x="37" y="20" width="5.500" height="80"/>
    <rect x="47.500" y="20" width="5.500" height="80"/>
    <rect x="67" y="20" width="5.500" height="80"/>
    <rect x="77.500" y="20" width="5.500" height="80"/>
  </g>
  <!-- contour de la fenêtre et sol -->
  <path d="M30 98V54a30 30 0 0 1 60 0V98" fill="none" stroke="#fff" stroke-width="3.200" stroke-linejoin="round"/>
  <path d="M14 98h92" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
</svg>
